<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피아니 - 악보 상세</title>
  <link rel="stylesheet" href="<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>

    <main class="main">
      <a href="home.html" class="back-link">← 뒤로</a>

      <!-- 곡 헤더 -->
      <header class="detail-header">
        <div class="title-row">
          <h1 class="song-title" id="song-title">—</h1>
          <button class="title-edit-btn" id="title-edit-btn" title="제목 수정">✏️</button>
        </div>
        <div class="title-edit-row" id="title-edit-row" style="display:none;">
          <input class="title-input" id="title-input" type="text" maxlength="60" placeholder="악보 제목 입력">
          <button class="title-save-btn" id="title-save-btn">저장</button>
          <button class="title-cancel-btn" id="title-cancel-btn">취소</button>
        </div>
        <div class="song-composer" id="song-composer">—</div>
      </header>

      <!-- 악보 미리보기 -->
    <section class="preview-card">
        <div class="preview-header">
            <span class="preview-label">악보 미리보기</span>
            <span class="preview-note">첫 4마디</span>
        </div>
        <div class="preview-osmd" id="preview-osmd">
            <div class="preview-status">악보 불러오는 중...</div>
        </div>
    </section>

      <!-- 곡 정보 카드 -->
      <section class="info-card">
        <div class="info-item">
          <div class="info-label">박자표</div>
          <div class="info-value" id="time-signature">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">조표</div>
          <div class="info-value" id="key-signature">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">원본 템포</div>
          <div class="info-value">♩=<span id="original-tempo">—</span></div>
        </div>
        <div class="info-item">
          <div class="info-label">예상 시간</div>
          <div class="info-value" id="duration">—</div>
        </div>
      </section>

      <!-- 연주 설정 -->
      <h2 class="section-title">연주 설정</h2>
      <section class="settings-card">

        <!-- 배속 (기존 템포 slider/counter 자리에) -->
        <div class="setting-row">
          <div class="setting-label">배속</div>
          <div class="setting-control">
            <div class="toggle-group" id="speed-toggle">
              <button class="toggle-btn" data-speed="0.5">0.5×</button>
              <button class="toggle-btn" data-speed="0.75">0.75×</button>
              <button class="toggle-btn active" data-speed="1">1×</button>
              <button class="toggle-btn" data-speed="1.25">1.25×</button>
              <button class="toggle-btn" data-speed="1.5">1.5×</button>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 반복 -->
        <div class="setting-row">
          <div class="setting-label">반복</div>
          <div class="setting-control">
            <div class="counter">
              <button class="counter-btn" id="repeat-minus" aria-label="반복 감소">−</button>
              <span class="counter-value"><span id="repeat-value">1</span>회</span>
              <button class="counter-btn" id="repeat-plus" aria-label="반복 증가">+</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 연주 시작 버튼 -->
      <button class="start-btn" id="start-btn">▶ 연주 시작</button>
    </main>
  </div>

  <script type="module">
    import { renderSidebar } from './js/sidebar.js';
    renderSidebar('practice', document.getElementById('sidebar'));
  </script>
  
  <script src="https://unpkg.com/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
