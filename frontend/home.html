<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피아니 - 홈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>

    <main class="main">
      <!-- 상단 헤더 -->
      <header class="home-header">
        <div class="header-top">
          <div class="home-logo">
            <img src="logo.png" alt="피AI노" class="home-logo-img">
            <span class="home-logo-text">피<span class="logo-ai">AI</span>노</span>
          </div>
          <div class="header-right">
<button class="header-icon-btn" onclick="location.href='score-history.html'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              기록
            </button>
            <button class="header-icon-btn" onclick="location.href='profile.html'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              프로필
            </button>
            <div class="weekly-stat">
              <span class="weekly-label">이번 주</span>
              <strong id="weekly-time">0분</strong>
            </div>
          </div>
        </div>
      </header>

      <!-- 이어서 연습 카드 -->
      <section class="continue-card" id="continue-card">
        <div class="continue-label">이어서 연습</div>
        <h2 class="continue-title">고요한 밤 거룩한 밤</h2>
        <div class="continue-meta">F. Gruber · 양손 · ♩=76</div>
        <div class="continue-bottom">
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width: 68%"></div></div>
            <span class="progress-text">68%</span>
          </div>
          <button class="resume-btn" id="resume-btn">
            <span class="play-icon">▶</span> 이어서 연주
          </button>
        </div>
      </section>

      <!-- 내 악보 그리드 -->
      <section class="scores-section">
        <div class="scores-header">
          <h3 class="scores-title">내 악보</h3>
          <div class="scores-actions">
            <a href="#" class="see-all">전체보기</a>
            <a href="index.html" class="add-score-btn">+ 새 악보</a>
          </div>
        </div>

        <div class="scores-grid" id="scores-grid">
          <!-- home.js에서 채움 -->
        </div>
      </section>
    </main>
  </div>

  <!-- 사이드바 주입 -->
  <script type="module">
    import { renderSidebar } from './js/sidebar.js';
    renderSidebar('home', document.getElementById('sidebar'));
  </script>

  <!-- 홈 화면 동적 데이터 -->
  <script src="js/home.js"></script>
</body>
</html>
